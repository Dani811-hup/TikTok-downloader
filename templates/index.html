<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="monetag" content="f13430ac2b772e3a9fef88fc7303bfcd">
<title>TikTok Video Downloader - HD</title>
<style>
body{margin:0;font-family:Arial;background:#fff}
.top{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#fff;box-shadow:0 2px 10px #0001}
.logo{background:#6a3df7;color:#fff;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;font-weight:bold;font-size:22px}
.install{background:linear-gradient(90deg,#ff00a8,#8a2dff);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:bold}
.hero{background:linear-gradient(180deg,#7d2dff,#4a1dff);padding:30px 15px 40px;text-align:center;color:#fff}
.hero h1{font-size:32px;margin:10px 0 25px;line-height:1.2}
.input-box{background:#e9d8ff;border-radius:15px;padding:8px;display:flex;align-items:center;max-width:500px;margin:auto}
.input-box input{flex:1;border:none;background:transparent;padding:15px;font-size:16px;outline:none;color:#333}
.paste-btn{background:#fff;border:1px solid #ccc;padding:10px 15px;border-radius:8px;display:flex;align-items:center;gap:5px;color:#6a3df7;font-weight:bold}
.download-btn{width:100%;max-width:500px;margin:15px auto 0;background:linear-gradient(90deg,#ff00b7,#7d2dff);color:#fff;border:none;padding:16px;border-radius:12px;font-size:18px;font-weight:bold;border:2px solid #fff5}
.card{margin:20px auto;max-width:500px;background:#1e2329;color:#fff;border-radius:20px;padding:20px;text-align:left}
video{width:100%;border-radius:12px;margin-top:10px}
</style></head>
<body>
<div class="top"><div class="logo">T</div><button class="install">⬇️ Install App</button><div>☰</div></div>
<div class="hero">
<h1>TikTok Video<br>Downloader</h1>
<div class="input-box"><input id="link" placeholder="Insert a link here"><button class="paste-btn" onclick="navigator.clipboard.readText().then(t=>document.getElementById('link').value=t)">📋 Paste</button></div>
<button class="download-btn" onclick="getV()">Download</button>
</div>
<div id="r" style="display:none;padding:15px"><div class="card"><p id="t"></p><video id="v" controls></video><br><br><a id="d" download style="color:#fff;background:#7d2dff;padding:12px 20px;border-radius:8px;text-decoration:none;display:block;text-align:center">⬇️ Save HD Video - No Watermark</a></div></div>
<script>async function getV(){let url=document.getElementById('link').value;if(!url) return alert('Link paste karo');document.getElementById('r').style.display='block';document.getElementById('t').innerText='Loading...';let res=await fetch('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});let data=await res.json();document.getElementById('t').innerText=data.title;document.getElementById('v').src=data.url;document.getElementById('d').href=data.url}</script>
</body></html>
